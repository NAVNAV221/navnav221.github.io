<html lang="en">

<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513; --surface:#171E1B; --ink:#E9EEEA; --ink-2:#BCC6C0; --muted:#8C9892; --rule:#2A3430;
    --accent:#8F9BFF; --on-accent:#101513; --error:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513; --surface:#171E1B; --ink:#E9EEEA; --ink-2:#BCC6C0; --muted:#8C9892; --rule:#2A3430;
  --accent:#8F9BFF; --on-accent:#101513; --error:#FF8A80;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;min-height:100vh}
.hidden{display:none !important}
.page{max-width:400px;margin:0 auto;padding-block:14vh 48px;display:flex;flex-direction:column;gap:24px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,48px);line-height:.95;letter-spacing:-0.01em;margin:0}
.hint{color:var(--ink-2);margin:0}
form{display:flex;flex-direction:column;gap:14px}
label.field{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type="password"],input[type="text"]{font:inherit;font-family:var(--body);font-size:17px;letter-spacing:normal;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;width:100%}
input[type="password"]:focus,input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.remember,.show{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.remember input,.show input{accent-color:var(--accent);width:16px;height:16px;margin:0}
button{font:inherit;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.04em;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:13px 16px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.error{color:var(--error);font-size:14px;margin:0;min-height:1.5em}
.spinner{display:flex;justify-content:center;padding-top:30vh}
.spinner span{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner span{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="staticrypt_loading" class="spinner" aria-label="Loading"><span></span></div>

  <h1>Nave Ben Naim</h1>

    <div class="row">

    </div>
    <button type="submit">Open portfolio</button>

</main>
