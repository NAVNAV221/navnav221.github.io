name: Build Jekyll site
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The old workflow used the jekyll/builder:3.8 container, which ships
      # Ruby 2.6. The lockfile needs Ruby >= 3.0 (ffi 1.17), so it could never
      # resolve. Build against the repo's own Gemfile on a supported Ruby.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build --future
